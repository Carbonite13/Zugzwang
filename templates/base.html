<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="{{ config.APP_NAME }} is a web application for managing the state of a chess game and offering chess puzzles based on it.">
    <meta name="author" content="{{ config.AUTHOR_NAME }}">
    <meta name="version" content="{{ config.VERSION }}">
    <meta name="keywords" content="chess,zugzwang,webapplication,engine,analysis,puzzles">
    <title>{% block title %}{{ config.APP_NAME }}{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', '/css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', '/css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', '/css/footer.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', 'favicon.ico') }}" type="image/x-icon">

</head>

<body>
    {% include "header.html" %}

    {% block content %}
    {# The main content will be in this block, this should be overridden in the inheriting
    templates
    #}
    {% endblock %}

    {% include "footer.html" %}

    {% block scripts %}
    {# The JS files will be included here #}
    {% endblock %}
</body>

</html>
