{% extends "base.html" %}

{% block title %}Sign In – {{ config.APP_NAME }}{% endblock %}

{% block content %}
<section class="flex min-h-[calc(100vh-100px)] items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">

    <!-- Card -->
    <div class="rounded-2xl border border-btn-dark/10 bg-bg-ivory/80 shadow-lg px-8 py-10">

      <!-- Heading -->
      <h1 class="font-neuton font-bold text-xxl-custom text-btn-dark text-center leading-tight">
        Sign In
      </h1>
      <p class="mt-2 text-center text-med-custom text-btn-dark/60 font-neuton">
        Welcome back to {{ config.APP_NAME }}.
      </p>

      <!-- Error banner (hidden by default; shown by JS on auth failure) -->
      <div id="error-banner"
           class="mt-4 hidden rounded-lg border border-red-300 bg-red-50 px-4 py-3
                  text-sm text-red-700 font-neuton">
        <span id="error-message"></span>
      </div>

      <!-- Form -->
      <form id="login-form" class="mt-8 flex flex-col gap-5" novalidate>

        <div class="flex flex-col gap-1">
          <label for="identifier" class="text-sm font-neuton font-semibold text-btn-dark">
            Username or Email
          </label>
          <input
            id="identifier"
            name="identifier"
            type="text"
            autocomplete="username"
            required
            placeholder="your_username or you@example.com"
            class="rounded-lg border border-btn-dark/20 bg-white px-4 py-2.5
                   text-med-custom font-neuton text-btn-dark placeholder-btn-dark/30
                   focus:outline-none focus:ring-2 focus:ring-btn-gold
                   transition"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="password" class="text-sm font-neuton font-semibold text-btn-dark">
            Password
          </label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
            class="rounded-lg border border-btn-dark/20 bg-white px-4 py-2.5
                   text-med-custom font-neuton text-btn-dark placeholder-btn-dark/30
                   focus:outline-none focus:ring-2 focus:ring-btn-gold
                   transition"
          />
        </div>

        <button
          id="submit-btn"
          type="submit"
          class="mt-2 w-full rounded-lg bg-btn-dark py-3 text-med-custom font-neuton
                 font-semibold text-bg-ivory hover:bg-btn-gold hover:text-btn-dark
                 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Sign In
        </button>
      </form>

      <!-- Footer link -->
      <p class="mt-6 text-center text-sm font-neuton text-btn-dark/60">
        No account yet?
        <a href="/auth/register"
           class="font-semibold text-btn-dark underline-offset-2 hover:underline">
          Join the Club
        </a>
      </p>

    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  const form      = document.getElementById('login-form');
  const submitBtn = document.getElementById('submit-btn');
  const banner    = document.getElementById('error-banner');
  const errorMsg  = document.getElementById('error-message');

  function showError(msg) {
    errorMsg.textContent = msg;
    banner.classList.remove('hidden');
  }

  function hideError() {
    banner.classList.add('hidden');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const identifier = document.getElementById('identifier').value.trim();
    const password   = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    try {
      const res = await fetch('/api/v1/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', identifier, password }),
      });

      const data = await res.json();

      if (!res.ok || data.error) {
        showError(data.error ?? data.detail ?? 'Login failed. Please try again.');
        return;
      }

      // Store tokens in sessionStorage (short-lived; swap to httpOnly cookie in prod)
      sessionStorage.setItem('access_token',  data.session.access_token);
      sessionStorage.setItem('refresh_token', data.session.refresh_token);
      sessionStorage.setItem('expires_at',    data.session.expires_at);

      window.location.href = '/';
    } catch (err) {
      showError('Network error. Please check your connection.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
</script>
{% endblock %}
